<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KON Luxury | تفاصيل المنتج</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=20260314b" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    /* ── Product Page Styles ── */
    .prod-page {
      min-height: 100vh;
      background: var(--dark2);
      padding: 120px 0 80px;
    }
    .prod-container {
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 var(--container-pad);
    }

    /* Back button */
    .prod-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-ar);
      font-size: 0.88rem;
      color: var(--ivory-dim);
      text-decoration: none;
      margin-bottom: 40px;
      padding: 10px 18px;
      border: 1px solid rgba(201,168,76,0.28);
      border-radius: 40px;
      background: rgba(201,168,76,0.06);
      transition: color 0.3s ease, border-color 0.3s ease, background 0.3s ease;
    }
    .prod-back:hover, .prod-back:active {
      color: var(--gold);
      border-color: var(--gold-dim);
      background: rgba(201,168,76,0.12);
    }
    .prod-back svg { transition: transform 0.3s ease; flex-shrink: 0; }
    [dir="rtl"] .prod-back:hover svg { transform: translateX(-4px); }

    /* Two-column layout */
    .prod-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: start;
    }

    /* ── LEFT: image ── */
    .prod-visual {
      position: sticky;
      top: 100px;
    }
    .prod-img-wrap {
      position: relative;
      background: var(--dark3);
      border: 1px solid var(--border-faint);
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 3/4;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .prod-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 1.2s var(--ease-out);
    }
    .prod-img-wrap:hover img { transform: scale(1.03); }
    .prod-img-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .prod-img-placeholder svg {
      width: 55%;
      max-width: 220px;
      height: auto;
    }
    /* color preview overlay on image */
    .prod-color-overlay {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
      mix-blend-mode: color;
    }
    .prod-img-wrap.has-color .prod-color-overlay { opacity: 0.28; }

    /* World badge on image */
    .prod-world-badge {
      position: absolute;
      top: 18px;
      right: 18px;
      font-family: var(--font-en);
      font-size: 8px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding: 5px 12px;
      border: 1px solid currentColor;
      border-radius: 2px;
      opacity: 0.8;
    }

    /* ── RIGHT: details ── */
    .prod-details { display: flex; flex-direction: column; gap: 0; }

    .prod-eyebrow {
      font-family: var(--font-en);
      font-size: 8px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold-dim);
      margin-bottom: 10px;
    }

    .prod-name {
      font-family: var(--font-display);
      font-size: 3.2rem;
      font-weight: 300;
      color: var(--ivory);
      line-height: 1.05;
      letter-spacing: 0.04em;
      margin-bottom: 14px;
    }

    .prod-desc {
      font-family: var(--font-ar);
      font-size: 0.9rem;
      color: var(--ivory-faint);
      line-height: 1.85;
      margin-bottom: 14px;
    }

    .prod-badge-wrap { margin-bottom: 32px; }

    /* Divider */
    .prod-divider {
      height: 1px;
      background: linear-gradient(90deg, rgba(201,168,76,0.18), transparent);
      margin: 24px 0;
    }

    /* Option label */
    .prod-opt-label {
      font-family: var(--font-en);
      font-size: 8px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold-dim);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .prod-opt-label span.selected-val {
      font-family: var(--font-ar);
      font-size: 0.75rem;
      letter-spacing: 0;
      color: var(--ivory-faint);
      text-transform: none;
    }

    /* ── COLOR PICKER ── */
    .color-swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .color-swatch {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      flex-shrink: 0;
    }
    .color-swatch:hover {
      transform: scale(1.12);
      box-shadow: 0 0 0 1px rgba(201,168,76,0.4);
    }
    .color-swatch.active {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.2), 0 0 12px rgba(201,168,76,0.3);
      transform: scale(1.1);
    }
    .color-swatch.active::after {
      content: '✓';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: rgba(255,255,255,0.85);
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }
    /* light colors get dark checkmark */
    .color-swatch.active.light-swatch::after { color: rgba(0,0,0,0.55); }

    /* ── BURN SIZE SELECTOR ── */
    .burn-size-options {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .burn-size-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 12px 22px;
      border: 1px solid rgba(201,168,76,0.28);
      border-radius: 4px;
      background: rgba(255,255,255,0.03);
      cursor: pointer;
      transition: border-color 0.3s ease, background 0.3s ease;
      min-width: 80px;
    }
    .burn-size-btn:hover {
      border-color: rgba(201,168,76,0.55);
      background: rgba(201,168,76,0.06);
    }
    .burn-size-btn.active {
      border-color: var(--gold);
      background: rgba(201,168,76,0.12);
    }
    .bsb-label {
      font-family: var(--font-en);
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--ivory);
      letter-spacing: 1px;
    }
    .bsb-price {
      font-family: var(--font-en);
      font-size: 0.72rem;
      color: var(--gold-dim);
      letter-spacing: 0.5px;
    }
    .burn-size-btn.active .bsb-label { color: var(--gold); }
    .burn-size-btn.active .bsb-price { color: var(--gold); }

    /* ── FRAGRANCE MOOD / SCENT SELECTOR ── */
    .scent-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .scent-chip {
      font-family: var(--font-ar);
      font-size: 0.82rem;
      color: var(--ivory);
      padding: 9px 18px;
      border: 1px solid rgba(201,168,76,0.30);
      border-radius: 40px;
      cursor: pointer;
      background: rgba(255,255,255,0.04);
      transition: border-color 0.3s ease, color 0.3s ease, background 0.3s ease;
      letter-spacing: 0.02em;
    }
    .scent-chip:hover {
      border-color: rgba(201,168,76,0.6);
      background: rgba(201,168,76,0.08);
    }
    .scent-chip.active {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(201,168,76,0.14);
      font-weight: 600;
    }

    /* ── QUANTITY ── */
    .qty-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .prod-qty {
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(201,168,76,0.22);
      border-radius: 4px;
      overflow: hidden;
    }
    .prod-qty-btn {
      background: none;
      border: none;
      color: var(--gold-dim);
      width: 42px;
      height: 42px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .prod-qty-btn:hover { background: rgba(201,168,76,0.1); color: var(--gold); }
    .prod-qty-val {
      width: 44px;
      text-align: center;
      font-family: var(--font-en);
      font-size: 1rem;
      color: var(--ivory-dim);
      border-left: 1px solid rgba(201,168,76,0.12);
      border-right: 1px solid rgba(201,168,76,0.12);
    }
    .prod-price-tag {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--gold);
      letter-spacing: 0.04em;
    }

    /* ── ACTION BUTTONS ── */
    .prod-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }

    .prod-btn-cart {
      width: 100%;
      padding: 17px;
      background: none;
      border: 1px solid rgba(201,168,76,0.4);
      color: var(--gold);
      font-family: var(--font-ar);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 3px;
      transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
    }
    .prod-btn-cart:hover {
      background: rgba(201,168,76,0.1);
      border-color: var(--gold);
    }
    .prod-btn-cart.added {
      border-color: var(--gold);
      background: rgba(201,168,76,0.14);
      color: var(--gold-light);
    }

    .prod-btn-wa {
      width: 100%;
      padding: 17px;
      background: #25d366;
      border: none;
      color: #fff;
      font-family: var(--font-ar);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.3s ease, transform 0.2s ease;
    }
    .prod-btn-wa:hover { background: #1fb558; transform: translateY(-1px); }

    /* ── Validation nudge ── */
    .prod-nudge {
      font-family: var(--font-ar);
      font-size: 0.78rem;
      color: rgba(220,160,80,0.75);
      text-align: center;
      height: 20px;
      transition: opacity 0.3s ease;
      opacity: 0;
    }
    .prod-nudge.show { opacity: 1; }

    /* ── Mobile ── */
    @media (max-width: 860px) {
      .prod-grid { grid-template-columns: 1fr; gap: 40px; }
      .prod-visual { position: static; }
      .prod-img-wrap { aspect-ratio: 4/3; max-height: 380px; }
      .prod-name { font-size: 2.4rem; }
    }
    @media (max-width: 480px) {
      .prod-page { padding: 90px 0 60px; }
      .prod-name { font-size: 2rem; }
      .color-swatch { width: 30px; height: 30px; }
    }
  </style>
</head>

  <script>
    // ── Page State ──
    let prodData        = null;
    let selectedColor   = null;   // { hex, name, light }
    let selectedSize    = null;   // { label, price }
    let selectedFrag    = null;   // { id, label, labelAr, icon }
    let prodQty         = 1;

    // ── Build the page from PRODUCTS data ──
    function buildPage(prod) {
      prodData = prod;
      document.title = `KON Luxury | ${prod.name}`;

      // World badge on image
      const worldBadge = document.getElementById('prodWorldBadge');
      worldBadge.textContent = 'KON LUXURY';
      worldBadge.style.color = 'var(--gold-dim)';

      // Image
      const imgContent = document.getElementById('prodImgContent');
      if (prod.img) {
        imgContent.innerHTML = `<img src="${prod.img}" alt="${prod.name}" style="width:100%;height:100%;object-fit:cover;display:block;">`;
      } else {
        imgContent.innerHTML = buildPlaceholderSVG(prod.waxHex);
      }

      // Text
      document.getElementById('prodName').textContent = prod.name;
      document.getElementById('prodDesc').textContent = prod.desc;
      document.getElementById('prodBadgeWrap').innerHTML =
        `<span class="product-badge" style="border-color:rgba(201,168,76,0.5);color:var(--gold)">${prod.badge}</span>`;

      // Wax Shade text
      const waxLabel = document.getElementById('waxShadeLabel');
      if (waxLabel) waxLabel.textContent = prod.waxShade;

      // Color swatches
      buildColorSwatches(prod.colors || []);

      // Burn Size buttons
      const sizeWrap = document.getElementById('burnSizeOptions');
      if (sizeWrap && typeof BURN_SIZES !== 'undefined') {
        sizeWrap.innerHTML = BURN_SIZES.map((s, i) => `
          <button class="burn-size-btn" onclick="selectSize(${i})" data-idx="${i}">
            <span class="bsb-label">${s.label}</span>
            <span class="bsb-price">₪${s.price}</span>
          </button>`).join('');
      }

      // Fragrance chips
      const fragWrap = document.getElementById('fragranceChips');
      if (fragWrap && typeof FRAGRANCE_MOODS !== 'undefined') {
        fragWrap.innerHTML = FRAGRANCE_MOODS.map((f, i) => `
          <button class="scent-chip" onclick="selectFrag(${i})" data-idx="${i}">
            ${f.icon} ${f.labelAr}
          </button>`).join('');
      }

      updatePrice();
    }

    function buildColorSwatches(colors) {
      const wrap = document.getElementById('colorSwatches');
      if (!wrap) return;
      if (!colors.length) { wrap.closest('.prod-divider') && (wrap.style.display='none'); return; }
      wrap.innerHTML = colors.map((c, i) => `
        <button class="color-swatch${c.light ? ' light-swatch' : ''}"
          style="background:${c.hex};"
          title="${c.name}"
          onclick="selectColor(${i})"
          aria-label="${c.name}">
        </button>`).join('');
    }

    function selectColor(idx) {
      const colors = prodData.colors || [];
      selectedColor = colors[idx];
      document.querySelectorAll('.color-swatch').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });
      const lbl = document.getElementById('colorLabel');
      if (lbl) lbl.textContent = selectedColor.name;
      // Tint the image overlay
      const overlay = document.getElementById('prodColorOverlay');
      const wrap    = document.getElementById('prodImgWrap');
      if (overlay && wrap) {
        overlay.style.background = selectedColor.hex;
        wrap.classList.add('has-color');
      }
    }

    function buildPlaceholderSVG(hex) {
      const c = hex || '#c9a84c';
      return `<div class="prod-img-placeholder">
        <svg viewBox="0 0 80 130" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="40" cy="122" rx="20" ry="5" fill="${c}" opacity="0.15"/>
          <rect x="27" y="50" width="26" height="72" rx="4" fill="${c}" stroke="rgba(201,168,76,0.4)" stroke-width="0.8" opacity="0.9"/>
          <rect x="33" y="50" width="12" height="72" rx="2" fill="${c}" opacity="0.5"/>
          <line x1="40" y1="50" x2="40" y2="33" stroke="#c9a84c" stroke-width="1" opacity="0.7"/>
          <path d="M40 8 C36 17 33 24 33 31 C33 38 36 40 40 40 C44 40 47 38 47 31 C47 24 44 17 40 8Z" fill="#c9a84c" opacity="0.85"/>
          <path d="M40 16 C38 22 37 27 37 32 C37 37 39 38 40 38 C41 38 43 37 43 32 C43 27 42 22 40 16Z" fill="white" opacity="0.7"/>
          <ellipse cx="40" cy="34" rx="2.5" ry="3" fill="white" opacity="0.55"/>
        </svg>
      </div>`;
    }

    function selectSize(idx) {
      selectedSize = BURN_SIZES[idx];
      document.querySelectorAll('.burn-size-btn').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });
      document.getElementById('sizeLabel').textContent = selectedSize.label;
      updatePrice();
    }

    function selectFrag(idx) {
      selectedFrag = FRAGRANCE_MOODS[idx];
      document.querySelectorAll('.scent-chip').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });
      document.getElementById('fragranceLabel').textContent =
        selectedFrag.icon + ' ' + selectedFrag.labelAr;
    }

    function changeQty(delta) {
      prodQty = Math.max(1, prodQty + delta);
      const el = document.getElementById('prodQtyVal');
      if (el) el.textContent = prodQty;
      updatePrice();
    }

    function updatePrice() {
      const tag = document.getElementById('priceTag');
      if (!tag) return;
      tag.textContent = selectedSize ? `₪${selectedSize.price * prodQty}` : '₪—';
    }

    function requireSelection() {
      if (!selectedSize || !selectedFrag) {
        const nudge = document.getElementById('prodNudge');
        nudge.classList.add('show');
        setTimeout(() => nudge.classList.remove('show'), 2800);
        return false;
      }
      return true;
    }

    function prodAddToCart() {
      if (!requireSelection()) return;
      const colorNote = selectedColor ? ` · ${selectedColor.name}` : '';
      for (let q = 0; q < prodQty; q++) {
        addToCart({
          ...prodData,
          price:     selectedSize.price,
          burnSize:  selectedSize.label,
          fragrance: selectedFrag.icon + ' ' + selectedFrag.labelAr + colorNote,
          qty: 1,
        });
      }
      showCartToast(prodData.name);
      const btn = document.getElementById('btnAddCart');
      btn.classList.add('added');
      btn.textContent = '✦ أُضيف للسلة';
      setTimeout(() => {
        btn.classList.remove('added');
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg> أضف للسلة`;
      }, 2000);
    }

    function prodOrderWA() {
      if (!requireSelection()) return;
      const delivery = (typeof DELIVERY !== 'undefined') ? DELIVERY : 25;
      const unitPrice = selectedSize.price;
      const totalItems = unitPrice * prodQty;
      const colorNote = selectedColor ? `\n🎨 اللون: ${selectedColor.name} (${selectedColor.hex})` : '';
      const msg =
`مرحباً،
أريد طلب شمعة Kōn Luxury:

🕯️ الموديل: ${prodData.name} Candle
🌑 Wax Shade: ${prodData.waxShade}${colorNote}
📦 Burn Size: ${selectedSize.label}
🌸 Fragrance: ${selectedFrag.icon} ${selectedFrag.labelAr}
🔢 الكمية: ${prodQty}
💰 السعر: ₪${totalItems}
🚚 التوصيل: ₪${delivery}
💎 الإجمالي: ₪${totalItems + delivery}

أرجو التأكيد، شكراً!`;
      const WA = (typeof WHATSAPP_NUMBER !== 'undefined') ? WHATSAPP_NUMBER : '9720549210470';
      window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // ── Init on load ──
    document.addEventListener('DOMContentLoaded', () => {
      updateCartBadge();

      // Lang switcher
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => setLanguage(btn.getAttribute('data-lang')));
      });

      const params = new URLSearchParams(window.location.search);
      const id = (params.get('id') || '').toLowerCase();

      if (typeof PRODUCTS === 'undefined' || !PRODUCTS[id]) {
        window.location = 'index.html#products';
        return;
      }

      buildPage(PRODUCTS[id]);

      // GSAP entrance animation
      if (typeof gsap !== 'undefined') {
        gsap.from('.prod-back',   { opacity:0, y:-10, duration:0.7, ease:'power3.out', delay:0.1 });
        gsap.from('.prod-visual', { opacity:0, x:-30, duration:1.1, ease:'power3.out', delay:0.2 });
        gsap.from('.prod-name',   { opacity:0, y:20,  duration:0.9, ease:'power3.out', delay:0.3 });
        gsap.from('.prod-desc',   { opacity:0, y:15,  duration:0.8, ease:'power3.out', delay:0.45 });
        gsap.from('.prod-divider, .prod-opt-label, .color-swatches, .burn-size-options, .scent-chips, .qty-row, .prod-actions',
          { opacity:0, y:12, duration:0.7, ease:'power3.out', stagger:0.07, delay:0.5 });
      }
    });
  </script>

</body>
</html>
